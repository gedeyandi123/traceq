name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

      - name: pre-commit
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
          SKIP: gitleaks
        run: |
          pip install pre-commit==4.7.0
          pre-commit run --all-files --show-diff-on-failure

      - name: typecheck and tests
        run: |
          pip install uv==0.11.23
          uv sync --locked
          uv run pyright
          uv run pytest -q

  web:
    name: web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # web/openapi.json and web/eval-openapi.json are checked against the system's and the
      # harness's APIs by pytest (tests/test_api.py, tests/test_eval_screen.py); the
      # TypeScript clients generated from them must be committed as generated (ADR 0003).
      - name: generated TypeScript client is current
        run: |
          npm run generate
          git diff --exit-code -- src/api/schema.ts src/api/eval-schema.ts

      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
