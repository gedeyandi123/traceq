name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.filter.outputs.python }}
      py_db: ${{ steps.filter.outputs.py_db }}
      py_slow: ${{ steps.filter.outputs.py_slow }}
      web: ${{ steps.filter.outputs.web }}
      py_deps: ${{ steps.filter.outputs.py_deps }}
      web_deps: ${{ steps.filter.outputs.web_deps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "py_db=true" >> "$GITHUB_OUTPUT"
            echo "py_slow=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "py_deps=true" >> "$GITHUB_OUTPUT"
            echo "web_deps=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          match() {
            echo "$CHANGED" | grep -Eq "$1" && echo "true" || echo "false"
          }
          echo "python=$(match '^(src/|tests/|scripts/|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$|recordings/|world/|answer_key/)')" >> "$GITHUB_OUTPUT"
          echo "py_db=$(match '^(src/traceq/|tests/|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$|compose\.yaml$)')" >> "$GITHUB_OUTPUT"
          echo "py_slow=$(match '^(src/|tests/|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$|recordings/)')" >> "$GITHUB_OUTPUT"
          echo "web=$(match '^(web/|src/traceq/app/api\.py$|src/traceq_eval/screen\.py$|\.github/workflows/ci\.yml$)')" >> "$GITHUB_OUTPUT"
          echo "py_deps=$(match '^(pyproject\.toml$|uv\.lock$)')" >> "$GITHUB_OUTPUT"
          echo "web_deps=$(match '^web/(package\.json|package-lock\.json)$')" >> "$GITHUB_OUTPUT"

  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

      - name: cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
          SKIP: gitleaks
        run: |
          pip install pre-commit==4.7.0
          pre-commit run --all-files --show-diff-on-failure

  py-fast:
    name: py-fast
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true

      - name: typecheck, boundaries, and fast tests
        run: |
          uv sync --locked
          uv run pyright
          uv run lint-imports
          uv run pytest -m "not slow and not db" -q

      - name: python dependency audit
        if: github.event_name == 'push' || needs.changes.outputs.py_deps == 'true'
        run: |
          uv export --frozen --no-hashes --no-emit-project -o "$RUNNER_TEMP/reqs.txt"
          uv run --no-project --with pip-audit pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/reqs.txt" --progress-spinner off

  py-db:
    name: py-db
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.py_db == 'true'
    runs-on: ubuntu-24.04
    # The database tests connect as the superuser, create the roles and a database of their
    # own; with CI set they fail, not skip, when Postgres is not reachable.
    services:
      postgres:
        image: postgres:17.12
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true

      - name: postgres tests
        run: |
          uv sync --locked
          uv run pytest -m db -q

  py-slow:
    name: py-slow
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.py_slow == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true

      - name: slow render, ingest, and pipeline tests
        run: |
          uv sync --locked
          uv run pytest -m "slow and not db" -q

  web:
    name: web
    needs: [changes]
    if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # web/openapi.json and web/eval-openapi.json are checked against the system's and the
      # harness's APIs by pytest (tests/test_api.py, tests/test_eval_screen.py); the
      # TypeScript clients generated from them must be committed as generated (ADR 0003).
      - name: generated TypeScript client is current
        run: |
          npm run generate
          git diff --exit-code -- src/api/schema.ts src/api/eval-schema.ts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: npm dependency audit
        if: github.event_name == 'push' || needs.changes.outputs.web_deps == 'true'
        run: npm audit --omit=dev --audit-level=high

  checks:
    name: checks
    runs-on: ubuntu-24.04
    needs: [hygiene, py-fast, py-db, py-slow, web]
    if: always()
    steps:
      - name: verify all required checks passed or were skipped
        run: |
          if [ "${{ needs.hygiene.result }}" != "success" ]; then
            echo "hygiene=${{ needs.hygiene.result }}"
            exit 1
          fi
          for res in "${{ needs.py-fast.result }}" "${{ needs.py-db.result }}" "${{ needs.py-slow.result }}" "${{ needs.web.result }}"; do
            if [ "$res" != "success" ] && [ "$res" != "skipped" ]; then
              echo "hygiene=${{ needs.hygiene.result }} py-fast=${{ needs.py-fast.result }} py-db=${{ needs.py-db.result }} py-slow=${{ needs.py-slow.result }} web=${{ needs.web.result }}"
              exit 1
            fi
          done
