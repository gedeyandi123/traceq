# PW-001 world data (dataset v1, HELD-OUT, ticket #200, spec #195).
#
# Held-out content lives only here, in answer_key/PW-001/ and in the corpus folder PW-001/.
# Issues, PRs, commits, tests and docs about PW-001 carry structure and counts only. The
# development session never reads this file (tests/test_isolation.py forbids the system to
# name it).
#
# A purified water system before IQ/OQ (design sections 4 and 5): city feed water ->
# pretreatment (multimedia, softener, activated carbon, 5 µm) -> RO + EDI -> SS 316L tank
# with hydrophobic vent filter -> ambient distribution loop with UV and periodic hot-water
# sanitisation -> online conductivity and TOC -> PLC/HMI. Same site and staff as TP-201; a
# new fictional vendor (a local integrator) and calibration lab.
#
# Sources (design principles 5 and 7):
# - quoted: WHO TRS 1033 Annex 3, Farmakope Indonesia Edisi VI (Air Murni monograph) and
#   PerBPOM 7/2024 Aneks 7, copied with url + verbatim quote; scripts/verify_quotes.py
#   checks them against the source PDFs;
# - site_decision: the plant's own choice with a rationale, optionally with a supporting
#   quote. All were drafted by an LLM and reviewed by the owner (non-practitioner), one
#   requirement at a time in three batches (18 Nov 2026); none was reviewed by a
#   practitioner.
#
# Judged flags (critical, transport_sensitive, site_only) and Coverage labels are
# LLM-drafted and owner-reviewed; none is reviewed by a practitioner. Flags the drafter
# marked uncertain carry the comment "not reviewed by a practitioner". Coverage classes
# follow the current decision table (traceq_dataset.coverage), which ignores calibration
# validity; URS-PW001-026 depends on that rule.
#
# Requirements are listed in URS order (matrix layout, clause numbers of the document's
# own). Units of scored values use one canonical symbol; wording around numbers varies.
# Check: uv run python -m traceq_dataset.world world/pw001.yaml

tag: PW-001
name: Purified water generation and distribution system
serial_no: TSR-PW-25-0093
model: TSR PW-2
site: site-01
site_name: PT Arunika Farma Lestari

# Vendor Assessment with its own areas: water treatment, mechanical and control are
# relied on; data integrity is not (the PLC software comes from a subcontractor the site
# has not audited), so Coverage condition 1 fails for data-integrity requirements.
vendor:
  id: vendor-pw001
  name: PT Tirta Sarana Rekayasa
  assessment:
    assessed_on: T0-230d
    scope: [water_treatment, mechanical, control]
    areas:
      - key: water_treatment
        label: "Pengolahan air (water treatment)"
        activities: "Pengolahan awal, RO dan EDI: desain, fabrikasi skid dan uji kinerja."
      - key: mechanical
        label: "Mekanik (mechanical)"
        activities: "Tangki, pipa distribusi, katup, pengelasan dan material bagian kontak air."
      - key: control
        label: "Sistem kendali (control system)"
        activities: "PLC, HMI, instrumentasi dan uji fungsi kendali."
      - key: data_integrity
        label: "Integritas data (data integrity)"
        activities: "Hak akses, catatan keamanan, tren dan cetakan data HMI; perangkat lunak PLC dibuat subkontraktor yang belum diaudit."

labs:
  - {id: lab-02, name: PT Presisi Kalibrasi Nusantara}

people:
  - {id: p-qe, name: Rina Wulandari, persona: qualification_engineer, employer: site-01}
  - {id: p-qs, name: Bayu Pratama, persona: qualification_supervisor, employer: site-01}
  - {id: p-qa, name: Dewi Anggraini, persona: qa_approver, employer: site-01}
  - {id: p-wit, name: Agus Setiawan, persona: witness, employer: site-01}
  - {id: p-ve, name: Teguh Prasetyo, persona: vendor_engineer, employer: vendor-pw001}
  - {id: p-vqc, name: Wahyu Kurniawan, persona: vendor_inspector, employer: vendor-pw001}
  - {id: p-labt, name: Andika Saputra, persona: lab_staff, employer: lab-02}
  - {id: p-labm, name: Nur Aini Rahmawati, persona: lab_staff, employer: lab-02}

protocols:
  - {doc_id: FAT-PW001-S, stage: FAT, vendor: vendor-pw001, site_approved_on: T0-130d, executed_on: T0-120d}
  # Control-panel FAT: the site approval is dated after execution (CPOB 12.14).
  - {doc_id: FAT-PW001-K, stage: FAT, vendor: vendor-pw001, site_approved_on: T0-111d, executed_on: T0-118d}
  - {doc_id: SAT-PW001, stage: SAT, vendor: vendor-pw001, site_approved_on: T0-25d, executed_on: T0-14d}

requirements:
  # --- 2. Air baku ------------------------------------------------------------------
  - id: URS-PW001-010
    section: "2. Air baku"
    clause: "2.1"
    text: "Air baku (PDAM) yang masuk ke pengolahan awal memenuhi persyaratan air minum."
    param: feed_water_quality
    spec: {type: present}
    source:
      kind: pharmacopoeia
      ref: "Farmakope Indonesia Edisi VI, monografi Air Murni"
      url: https://farmalkes.kemkes.go.id/en/unduh/farmakope-indonesia-edisi-vi/?wpdmdl=9504
      quote: "Air Murni adalah air yang memenuhi persyaratan air minum"
      accessed: 2026-11-18
    scope: water_treatment
    critical: false  # not reviewed by a practitioner
    site_only: true  # not reviewed by a practitioner (a design basis in many real URSs)
    intended_coverage: site_only

  # --- 3. Kinerja dan mutu air ------------------------------------------------------
  - id: URS-PW001-001
    section: "3. Kinerja dan mutu air"
    clause: "3.1.1"
    # The bound is written out ("2,0"), not filled from spec ("2"), as reviewed.
    text: "Kapasitas produksi Air Murni pada keluaran EDI tidak kurang dari 2,0 m³/jam."
    param: edi_product_flow
    spec: {type: range, min: 2.0, unit: m³/h}
    source:
      kind: site_decision
      ref: "VMP-PW001, site decision"
      rationale: "Peak demand of the plant (washing, granulation, coating) is about 12 m³/day, met by 2.0 m³/h over about 6 h with the storage tank as buffer (12 / 6 = 2)."
      drafted_by: llm
      reviewed_by: owner
    scope: water_treatment
    intended_coverage: covered_by_vendor
  - id: URS-PW001-024
    section: "3. Kinerja dan mutu air"
    clause: "3.1.2"
    text: "Klorin bebas di keluaran filter karbon aktif maks. {max} mg/L."
    param: carbon_outlet_free_chlorine
    spec: {type: range, max: 0.05, unit: mg/L}
    source:
      kind: site_decision
      ref: "VMP-PW001, site decision"
      rationale: "City water contains chlorine and free chlorine damages RO membranes, so the carbon filter must remove it. Membrane makers usually allow about 0.1 mg/L; the site chose 0.05 mg/L as a margin."
      drafted_by: llm
      reviewed_by: owner
    scope: water_treatment
    critical: false  # not reviewed by a practitioner
    intended_coverage: covered_by_vendor
  - id: URS-PW001-015
    section: "3. Kinerja dan mutu air"
    clause: "3.1.3"
    text: "Kesadahan air keluaran softener maks. {max} mg/L sebagai CaCO₃."
    param: softener_outlet_hardness
    spec: {type: range, max: 1, unit: mg/L}
    source:
      kind: site_decision
      ref: "VMP-PW001, site decision; see WHO TRS 1033 Annex 3 §4.2.10"
      rationale: "The softener protects the RO membranes from scaling; 1 mg/L as CaCO₃ is a common softener outlet target. The quote only shows that softeners are a recognised control point; the number is not from a public source."
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "Controls should be implemented to minimize the microbiological contamination of sand filters, carbon beds and water softeners."
      accessed: 2026-11-18
      drafted_by: llm
      reviewed_by: owner
    scope: water_treatment
    critical: false  # not reviewed by a practitioner
    intended_coverage: partial  # SAT result failed; the FAT result alone is not enough (condition 4)
  - id: URS-PW001-025
    section: "3. Kinerja dan mutu air"
    clause: "3.1.4"
    text: "Konduktivitas permeat RO tidak lebih dari {max} µS/cm."
    param: ro_permeate_conductivity
    spec: {type: range, max: 20, unit: µS/cm}
    source:
      kind: site_decision
      ref: "VMP-PW001, site decision"
      rationale: "RO permeate is the EDI feed; EDI makers usually ask for a feed below about 40 µS/cm; the site chose 20 µS/cm as a margin."
      drafted_by: llm
      reviewed_by: owner
    scope: water_treatment
    critical: false  # not reviewed by a practitioner
    intended_coverage: partial  # transport-sensitive, FAT only (condition 4)
  - id: URS-PW001-002
    section: "3. Kinerja dan mutu air"
    clause: "3.2.1"
    text: "Konduktivitas air keluaran EDI maks. {max} µS/cm pada 25 °C (FI VI <925>, Tahap 1)."
    param: edi_outlet_conductivity
    spec: {type: range, max: 1.3, unit: µS/cm}
    source:
      kind: site_decision
      ref: "VMP-PW001, site decision; see Farmakope Indonesia Edisi VI <925>, Tahap 1"
      rationale: "Stage 1 limit of FI VI <925> at 25 °C (1.3 µS/cm). The limit sits in a table with separate columns, so it cannot be quoted as one contiguous passage."
      drafted_by: llm
      reviewed_by: owner
    scope: water_treatment
    critical: true
    intended_coverage: partial  # transport-sensitive, FAT only (condition 4)
  - id: URS-PW001-035
    section: "3. Kinerja dan mutu air"
    clause: "3.2.2"
    text: "Konduktivitas Air Murni di setiap titik pengguna maks. {max} µS/cm pada 25 °C (FI VI <925>, Tahap 1)."
    param: pou_conductivity
    spec: {type: range, max: 1.3, unit: µS/cm}
    source:
      kind: site_decision
      ref: "VMP-PW001, site decision; see Farmakope Indonesia Edisi VI <925>, Tahap 1"
      rationale: "Stage 1 limit of FI VI <925> at 25 °C (1.3 µS/cm), as for the EDI outlet. The limit sits in a table with separate columns, so it cannot be quoted as one contiguous passage."
      drafted_by: llm
      reviewed_by: owner
    scope: water_treatment
    critical: true
    site_only: true
    intended_coverage: site_only
  - id: URS-PW001-003
    section: "3. Kinerja dan mutu air"
    clause: "3.2.3"
    text: "Karbon organik total (TOC) di setiap titik pengguna tidak lebih dari {max} mg/L."
    param: pou_toc
    spec: {type: range, max: 0.5, unit: mg/L}
    source:
      kind: pharmacopoeia
      ref: "Farmakope Indonesia Edisi VI, monografi Air Murni"
      url: https://farmalkes.kemkes.go.id/en/unduh/farmakope-indonesia-edisi-vi/?wpdmdl=9504
      quote: "Karbon organik total <875> Tidak lebih dari 0,5 mg per liter."
      accessed: 2026-11-18
    scope: water_treatment
    critical: true
    site_only: true
    intended_coverage: site_only
  - id: URS-PW001-013
    section: "3. Kinerja dan mutu air"
    clause: "3.2.4"
    text: "Angka lempeng total Air Murni di setiap titik pengguna tidak lebih dari {max} CFU/mL."
    param: pou_total_aerobic_count
    spec: {type: range, max: 100, unit: CFU/mL}
    source:
      kind: pharmacopoeia
      ref: "Farmakope Indonesia Edisi VI, monografi Air Murni"
      url: https://farmalkes.kemkes.go.id/en/unduh/farmakope-indonesia-edisi-vi/?wpdmdl=9504
      quote: "Uji batas mikroba <51> Angka lempeng total tidak lebih dari 100 koloni per mL."
      accessed: 2026-11-18
    scope: water_treatment
    critical: true
    site_only: true
    intended_coverage: site_only

  # --- 4. Material dan konstruksi ---------------------------------------------------
  - id: URS-PW001-004
    section: "4. Material dan konstruksi"
    clause: "4.1.1"
    text: "Tangki, pipa distribusi dan katup yang bersentuhan dengan air dibuat dari baja tahan karat {allowed}."
    param: wetted_material
    spec: {type: one_of, allowed: [SS 316L]}
    source:
      kind: regulation
      ref: "WHO TRS 1033 Annex 3 §7"
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "Stainless-steel grade 316L or polyvinylidene chloride (PVDC) is generally recommended."
      accessed: 2026-11-18
    scope: mechanical
    critical: true
    transport_sensitive: false  # not reviewed by a practitioner (TP-201 practitioner: "depends" for material)
    intended_coverage: covered_by_vendor
  - id: URS-PW001-005
    section: "4. Material dan konstruksi"
    clause: "4.2.2"
    text: "Pipa distribusi dipasang dengan kemiringan ≥ {min} % (1/100) ke arah titik drainase."
    param: loop_slope
    spec: {type: range, min: 1, unit: "%"}
    source:
      kind: regulation
      ref: "WHO TRS 1033 Annex 3 §7"
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "The system should be installed to promote drainability with a recommended minimum slope of 1/100."
      accessed: 2026-11-18
    scope: mechanical
    critical: false  # not reviewed by a practitioner
    intended_coverage: covered_by_vendor
  - id: URS-PW001-022
    section: "4. Material dan konstruksi"
    clause: "4.2.3"
    text: "Pipa baja tahan karat dilas orbital (las manual hanya bila perlu); log las, kualifikasi juru las dan catatan inspeksi las diserahkan."
    param: orbital_welding
    spec: {type: present}
    source:
      kind: regulation
      ref: "WHO TRS 1033 Annex 3 §7.2.1"
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "Stainless steel systems should be orbitally welded, with manual welds where necessary."
      accessed: 2026-11-18
    scope: mechanical
    critical: false  # not reviewed by a practitioner
    intended_coverage: partial  # FAT covers skid welds only, loop welds are made on site (condition 4)
  - id: URS-PW001-028
    section: "4. Material dan konstruksi"
    clause: "4.2.4"
    # The bound is written out ("1,0"), not filled from spec ("1"), as reviewed.
    text: "Katup sampel bertipe sanitasi dengan kekasaran permukaan dalam Ra maks. 1,0 µm."
    param: sample_valve_roughness
    spec: {type: range, max: 1.0, unit: µm}
    source:
      kind: regulation
      ref: "WHO TRS 1033 Annex 3 §7.2.1"
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "Sample valves should be sanitary type with the surface roughness of 1.0 micrometer RA or lower for PW and WFI systems"
      accessed: 2026-11-18
    scope: mechanical
    critical: false  # not reviewed by a practitioner
    transport_sensitive: false
    intended_coverage: conflict  # datasheet finish does not meet the URS; no planted finding
  - id: URS-PW001-007
    section: "4. Material dan konstruksi"
    clause: "4.3.1"
    text: "Tangki penyimpanan dilengkapi vent filter hidrofobik dengan ukuran pori maks. {max} µm."
    param: vent_filter_pore_size
    spec: {type: range, max: 0.2, unit: µm}
    source:
      kind: site_decision
      ref: "VMP-PW001, site decision; see WHO TRS 1033 Annex 3"
      rationale: "The guideline asks for bacteria-retentive hydrophobic vent filters without a number; 0.2 µm is the usual bacteria-retentive pore size."
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "the fitting of bacteria-retentive, hydrophobic vent filters which are tested for their integrity at appropriate intervals"
      accessed: 2026-11-18
      drafted_by: llm
      reviewed_by: owner
    scope: mechanical
    critical: true
    transport_sensitive: false
    intended_coverage: conflict  # S1: datasheet vent filter does not meet the URS
  - id: URS-PW001-018
    section: "4. Material dan konstruksi"
    clause: "4.3.2"
    # The bound is written out ("3,0"), not filled from spec ("3"), as reviewed.
    text: "Volume kerja tangki penyimpanan tidak kurang dari 3,0 m³."
    param: tank_working_volume
    spec: {type: range, min: 3.0, unit: m³}
    source:
      kind: site_decision
      ref: "VMP-PW001, site decision; see WHO TRS 1033 Annex 3 §9.2"
      rationale: "About 1.5 h of reserve at the average use of 2 m³/h when treatment stops (softener regeneration, failures): 1.5 × 2 = 3 m³."
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "short-term reserve capacity in the event of failure of the water-treatment system or the inability to produce water"
      accessed: 2026-11-18
      drafted_by: llm
      reviewed_by: owner
    scope: mechanical
    critical: false
    transport_sensitive: false
    intended_coverage: conflict  # datasheet volume does not meet the URS; no planted finding
  - id: URS-PW001-031
    section: "4. Material dan konstruksi"
    clause: "4.3.3"
    text: "Tangki penyimpanan dilengkapi bursting disc bertipe sanitasi dengan indikator pecah eksternal."
    param: bursting_disc
    spec: {type: present}
    source:
      kind: regulation
      ref: "WHO TRS 1033 Annex 3 §9.2"
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "the fitting of sanitary design pressure safety valves or bursting discs provided with external rupture indicators to ensure that loss of system integrity is detected"
      accessed: 2026-11-18
    scope: mechanical
    critical: false  # not reviewed by a practitioner
    transport_sensitive: false
    intended_coverage: gap  # probe P5
  # One URS row, two requirements under clause 4.4.1.
  - id: URS-PW001-020
    section: "4. Material dan konstruksi"
    clause: "4.4.1"
    text: "Loop distribusi lulus uji tekanan hidrostatik tanpa kebocoran sebelum dioperasikan."
    param: loop_pressure_test
    spec: {type: present}
    source:
      kind: regulation
      ref: "WHO TRS 1033 Annex 3 §7.2.1"
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "Where appropriate, pressure or hydro-tests for leaks, spray-ball functionality test and flow turbulence should be considered."
      accessed: 2026-11-18
    scope: mechanical
    critical: false  # not reviewed by a practitioner
    intended_coverage: covered_by_vendor
  - id: URS-PW001-021
    section: "4. Material dan konstruksi"
    clause: "4.4.1"
    text: "Permukaan baja tahan karat loop dipasivasi setelah pemasangan menurut prosedur tertulis (larutan, konsentrasi, suhu dan waktu kontak)."
    param: loop_passivation
    spec: {type: present}
    source:
      kind: regulation
      ref: "WHO TRS 1033 Annex 3 §7.2.1"
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "Passivation should be considered for stainless steel systems, for example, for non-electropolished surfaces (after initial installation and after significant modification)"
      accessed: 2026-11-18
    scope: mechanical
    critical: false  # not reviewed by a practitioner
    intended_coverage: covered_by_vendor
  - id: URS-PW001-023
    section: "4. Material dan konstruksi"
    clause: "4.5.1"
    text: "Semua komponen diberi label identitas dan arah aliran ditandai pada pipa."
    param: component_labelling
    spec: {type: present}
    source:
      kind: regulation
      ref: "WHO TRS 1033 Annex 3 §10.9"
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "Components should be identified and labelled. The direction of flow should be indicated."
      accessed: 2026-11-18
    scope: mechanical
    critical: false
    transport_sensitive: false
    intended_coverage: gap  # no step checks it; not a probe

  # --- 5. Distribusi, sanitasi dan instrumentasi -----------------------------------
  - id: URS-PW001-011
    section: "5. Distribusi, sanitasi dan instrumentasi"
    clause: "5.1.1"
    text: "Selama sanitasi panas, PLC menutup dan mengunci semua katup titik pengguna secara otomatis."
    param: sanitisation_valve_lock
    spec: {type: present}
    source:
      kind: regulation
      ref: "WHO TRS 1033 Annex 3 §8.2"
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "Controls may include using chemical and/or thermal sanitization procedures as appropriate for production, storage and distribution systems."
      accessed: 2026-11-18
    scope: control
    critical: true  # not reviewed by a practitioner
    intended_coverage: partial  # transport-sensitive, FAT only (condition 4)
  - id: URS-PW001-006
    section: "5. Distribusi, sanitasi dan instrumentasi"
    clause: "5.1.2"
    text: "Sanitasi panas loop distribusi mencapai sekurang-kurangnya {min} °C di pipa kembali (return)."
    param: sanitisation_temperature
    spec: {type: range, min: 80, unit: °C}
    source:
      kind: site_decision
      ref: "VMP-PW001, site decision; see WHO TRS 1033 Annex 3 §8.3"
      rationale: "80 °C gives a margin above the 70 °C the guideline names; it is measured at the loop return, the coldest point of the loop."
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "Systems that operate and are maintained at elevated temperatures (e.g. > 70 °C) are generally less susceptible to microbiological contamination"
      accessed: 2026-11-18
      drafted_by: llm
      reviewed_by: owner
    scope: control
    critical: true
    intended_coverage: gap  # probe P1
  - id: URS-PW001-008
    section: "5. Distribusi, sanitasi dan instrumentasi"
    clause: "5.2.1"
    text: "Lampu UV pada loop dilengkapi sensor intensitas independen dengan alarm di HMI."
    param: uv_intensity_monitoring
    spec: {type: present}
    source:
      kind: regulation
      ref: "WHO TRS 1033 Annex 3 §8.6"
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "Considering the use of ultraviolet lamps in the system where needed with independent monitoring."
      accessed: 2026-11-18
    scope: control
    critical: true  # not reviewed by a practitioner
    intended_coverage: partial  # tested only in the late-approved control FAT (condition 2)
  - id: URS-PW001-012
    section: "5. Distribusi, sanitasi dan instrumentasi"
    clause: "5.3.1"
    text: "Suhu Air Murni di pipa kembali loop selama operasi normal maks. {max} °C."
    param: loop_return_temperature
    spec: {type: range, max: 25, unit: °C}
    source:
      kind: site_decision
      ref: "VMP-PW001, site decision; see WHO TRS 1033 Annex 3 §8.3"
      rationale: "Ambient loop: a low temperature slows microbial growth. Site feed water is about 28–30 °C, so the heat exchanger (also used for sanitisation) cools the loop."
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "When lower temperatures are required due to the water treatment processes employed, or the temperature requirements for the water in use, special precautions should be taken"
      accessed: 2026-11-18
      drafted_by: llm
      reviewed_by: owner
    scope: control
    critical: false  # not reviewed by a practitioner
    intended_coverage: covered_by_vendor
  - id: URS-PW001-034
    section: "5. Distribusi, sanitasi dan instrumentasi"
    clause: "5.3.2"
    text: "Penukar panas HX-301 dipasang langsung di aliran loop yang bersirkulasi terus-menerus, tanpa cabang yang airnya diam."
    param: heat_exchanger_in_loop
    spec: {type: present}
    source:
      kind: regulation
      ref: "WHO TRS 1033 Annex 3 §10.4"
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "Where heat exchangers are used, they should be arranged in continually circulating loops or sub-loops in order to avoid unacceptable static water in the system."
      accessed: 2026-11-18
    scope: mechanical
    critical: false  # not reviewed by a practitioner
    intended_coverage: covered_by_vendor
  - id: URS-PW001-017
    section: "5. Distribusi, sanitasi dan instrumentasi"
    clause: "5.4.1"
    # The bound is written out ("1,0"), not filled from spec ("1"), as reviewed.
    text: "Kecepatan alir di pipa kembali loop sekurang-kurangnya 1,0 m/s selama operasi normal."
    param: loop_return_velocity
    spec: {type: range, min: 1.0, unit: m/s}
    source:
      kind: site_decision
      ref: "VMP-PW001, site decision; see WHO TRS 1033 Annex 3 §8.6"
      rationale: "Flow must be turbulent so that biofilm forms less easily; in DN25 pipe (inner diameter about 22 mm) at 25 °C, 1 m/s gives a Reynolds number of about 25,000, well above 4,000."
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "The maintenance of a continuous circulation of water maintaining turbulent flow evidenced by, for example, a Reynolds number of > 4000."
      accessed: 2026-11-18
      drafted_by: llm
      reviewed_by: owner
    scope: mechanical
    critical: false  # not reviewed by a practitioner
    intended_coverage: covered_by_vendor
  - id: URS-PW001-016
    section: "5. Distribusi, sanitasi dan instrumentasi"
    clause: "5.4.2"
    text: "Dua pompa distribusi (kerja/cadangan) bergantian otomatis secara berkala, sehingga tidak ada air diam di pompa yang tidak dipakai."
    param: standby_pump_alternation
    spec: {type: present}
    source:
      kind: regulation
      ref: "WHO TRS 1033 Annex 3 §10.7"
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "Where stand-by pumps are provided, they should be configured or managed to avoid zones where stagnant water is trapped within the system."
      accessed: 2026-11-18
    scope: control
    critical: false  # not reviewed by a practitioner
    intended_coverage: gap  # probe P2
  - id: URS-PW001-032
    section: "5. Distribusi, sanitasi dan instrumentasi"
    clause: "5.4.3"
    text: "Debit di titik pengguna POU-05 (ruang pencucian) tidak kurang dari {min} L/h saat katup dibuka penuh."
    param: pou05_flow
    spec: {type: range, min: 1000, unit: L/h}
    source:
      kind: site_decision
      ref: "VMP-PW001, site decision; see WHO TRS 1033 Annex 3 §4.3.4"
      rationale: "Rinsing equipment in the washing room needs about 1 m³ of water per hour."
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "the quantity of water required by the user"
      accessed: 2026-11-18
      drafted_by: llm
      reviewed_by: owner
    scope: mechanical
    critical: false
    intended_coverage: partial  # S5: the SAT value reads two ways, awaiting confirmation
  - id: URS-PW001-026
    section: "5. Distribusi, sanitasi dan instrumentasi"
    clause: "5.5.1"
    text: "Pembacaan sensor konduktivitas online di pipa kembali loop (CIT-302) diverifikasi terhadap meter acuan terkalibrasi; selisihnya maks. {max} µS/cm."
    param: online_conductivity_verification
    spec: {type: range, max: 0.1, unit: µS/cm}
    source:
      kind: site_decision
      ref: "VMP-PW001, site decision; see WHO TRS 1033 Annex 3 §7.2.1"
      rationale: "The site accepts water daily on the online sensor's reading, so it must agree with a reference instrument; 0.1 µS/cm is about 8% of the 1.3 µS/cm limit."
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "Provision should be made for in-line measurement for total organic carbon (TOC), conductivity, pressure, flow and temperature."
      accessed: 2026-11-18
      drafted_by: llm
      reviewed_by: owner
    scope: control
    critical: true
    # S4: the SAT step used a reference meter whose calibration had expired. The decision
    # table ignores calibration validity (a practitioner candidate condition, design doc),
    # so this class depends on a rule no practitioner reviewed.
    intended_coverage: covered_by_vendor
  - id: URS-PW001-027
    section: "5. Distribusi, sanitasi dan instrumentasi"
    clause: "5.5.2"
    text: "Analyzer TOC online dipasang di pipa kembali loop; nilainya tampil dan terekam di HMI."
    param: online_toc_analyser
    spec: {type: present}
    source:
      kind: regulation
      ref: "WHO TRS 1033 Annex 3 §12.3"
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "Parameters such as flow, pressure, and temperature should be monitored with online instruments – as well as conductivity and TOC, where possible."
      accessed: 2026-11-18
    scope: control
    critical: true  # not reviewed by a practitioner
    intended_coverage: gap  # probe P4

  # --- 6. Kontrol dan integritas data ----------------------------------------------
  - id: URS-PW001-009
    section: "6. Kontrol dan integritas data"
    clause: "6.1.3"
    text: "Data tren konduktivitas, TOC dan suhu yang tersimpan di HMI dapat dicetak sebagai salinan yang jelas."
    param: trend_printout
    spec: {type: present}
    source:
      kind: regulation
      ref: "PerBPOM 7/2024 Aneks 7 butir 8.1"
      url: https://peraturan.go.id/files/peraturan-bpom-no-7-tahun-2024.pdf
      quote: "Seharusnya memungkinkan untuk mendapatkan salinan jelas dari data yang tersimpan secara elektronik."
      accessed: 2026-11-18
    scope: data_integrity
    critical: true  # not reviewed by a practitioner
    intended_coverage: partial  # data integrity not relied on (condition 1)
  - id: URS-PW001-029
    section: "6. Kontrol dan integritas data"
    clause: "6.1.4"
    text: "Pembuatan, perubahan dan pencabutan hak akses pengguna HMI tercatat otomatis, dengan nama pengguna, tanggal dan waktu."
    param: access_change_log
    spec: {type: present}
    source:
      kind: regulation
      ref: "PerBPOM 7/2024 Aneks 7 butir 12.3"
      url: https://peraturan.go.id/files/peraturan-bpom-no-7-tahun-2024.pdf
      quote: "Penciptaan, perubahan, dan pembatalan otorisasi akses seharusnya dicatat."
      accessed: 2026-11-18
    scope: data_integrity
    critical: true  # not reviewed by a practitioner
    intended_coverage: partial  # data integrity not relied on (condition 1)
  - id: URS-PW001-019
    section: "6. Kontrol dan integritas data"
    clause: "6.2.1"
    text: "HMI memberi alarm bila konduktivitas online di keluaran EDI melewati batas alarm; alarm tercatat dengan waktu dan nama pengguna yang mengakuinya."
    param: conductivity_alarm
    spec: {type: present}
    source:
      kind: regulation
      ref: "WHO TRS 1033 Annex 3 §12.3"
      url: https://cdn.who.int/media/docs/default-source/medicines/norms-and-standards/guidelines/inspections/trs1033-annex3-gmp-water-for-pharmaceuticals-use.pdf
      quote: "A combination of online and offline instruments, linked to appropriately qualified alarm systems, should be used."
      accessed: 2026-11-18
    scope: control
    critical: true
    intended_coverage: partial  # late-approved control FAT (condition 2); probe P3
  - id: URS-PW001-030
    section: "6. Kontrol dan integritas data"
    clause: "6.3.1"
    text: "Setelah listrik padam dan pulih, sistem tidak menyala sendiri: PLC kembali ke keadaan aman (pompa berhenti, katup titik pengguna tertutup) dan menunggu konfirmasi operator."
    param: power_failure_restart
    spec: {type: present}
    source:
      kind: site_decision
      ref: "VMP-PW001, site decision"
      rationale: "If the system restarted unattended, water that stood still in the pipes during the outage could reach the points of use; an operator checks the system first."
      drafted_by: llm
      reviewed_by: owner
    scope: control
    critical: false  # not reviewed by a practitioner
    intended_coverage: partial  # late-approved control FAT (condition 2)

  # --- 7. Pemantauan ----------------------------------------------------------------
  - id: URS-PW001-014
    section: "7. Pemantauan"
    clause: "7.1.1"
    text: "Pabrik menjalankan rencana pemantauan tertulis; sampel diambil dari setiap titik pengguna dan dari pipa kembali loop."
