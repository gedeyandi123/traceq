  - id: URS-PW001-036
    section: "7. Pemantauan"
    clause: "7.1.2"
    text: "Pabrik menetapkan batas waspada (alert) dan batas bertindak (action) untuk konduktivitas, TOC dan angka lempeng total dari data pemantauan yang terkumpul."
