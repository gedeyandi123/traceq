      accessed: 2026-11-18
    scope: mechanical
    critical: false
    intended_coverage: covered_by_vendor

# Executed FAT/SAT steps. FATs are printed in English; SAT results are handwritten by site
# staff in Indonesian number formats on the English vendor form. Some steps word their
# Acceptance Criterion (acceptance_text: NLT, NMT, ...); steps that carry a planted defect
# print the symbol form, because the system's rules do not judge word-form criteria.
tests:
  # FAT, water-treatment skid (approved by the site before execution).
  - {step: FAT-S-01, protocol: FAT-PW001-S, requirement: URS-PW001-001, description: "Product flow at EDI outlet: run the skid on the vendor's test water and read the product flow meter.", acceptance_text: "NLT 2 m³/h", observed: {type: number, value: 2.1, unit: m³/h}, recorded_result: pass}
  - {step: FAT-S-02, protocol: FAT-PW001-S, requirement: URS-PW001-002, description: "EDI outlet conductivity: read the conductivity at the EDI outlet on the vendor's test water.", acceptance_text: "NMT 1.3 µS/cm", observed: {type: number, value: 0.12, unit: µS/cm}, recorded_result: pass}
  - {step: FAT-S-03, protocol: FAT-PW001-S, requirement: URS-PW001-004, description: "Review of 3.1 certificates of wetted parts (tank, loop pipework, valves).", observed: {type: text, value: SS 316L}, recorded_result: pass}
  - {step: FAT-S-04, protocol: FAT-PW001-S, requirement: URS-PW001-011, description: "Hot water sanitisation – valve sequence: start the sequence and check that the PLC closes and locks every point-of-use valve.", observed: {type: present, value: true}, recorded_result: pass}
  - {step: FAT-S-05, protocol: FAT-PW001-S, requirement: URS-PW001-015, description: "Softener outlet hardness: test a sample at the softener outlet (as CaCO₃).", observed: {type: number, value: 0.4, unit: mg/L}, recorded_result: pass}
  - {step: FAT-S-06, protocol: FAT-PW001-S, requirement: URS-PW001-022, description: "Review weld logs and welder qualification – skid pipework.", observed: {type: present, value: true}, recorded_result: pass}
  - {step: FAT-S-07, protocol: FAT-PW001-S, requirement: URS-PW001-024, description: "Carbon filter outlet free chlorine: test a sample at the carbon filter outlet.", acceptance_text: "NMT 0.05 mg/L", observed: {type: number, value: 0.02, unit: mg/L}, recorded_result: pass}
  - {step: FAT-S-08, protocol: FAT-PW001-S, requirement: URS-PW001-025, description: "RO permeate conductivity: read the RO permeate conductivity on the vendor's test water.", acceptance_text: "NMT 20 µS/cm", observed: {type: number, value: 4.8, unit: µS/cm}, recorded_result: pass}
  # FAT, control panel and HMI (S2: approved by the site after execution).
  - {step: FAT-K-01, protocol: FAT-PW001-K, requirement: URS-PW001-008, description: "Simulate UV intensity low – alarm on HMI.", observed: {type: present, value: true}, recorded_result: pass}
  - {step: FAT-K-02, protocol: FAT-PW001-K, requirement: URS-PW001-009, description: "Print 24 h trend report.", observed: {type: present, value: true}, recorded_result: pass}
  - {step: FAT-K-03, protocol: FAT-PW001-K, requirement: URS-PW001-019, description: "Simulate high conductivity at the EDI outlet sensor – alarm on HMI.", observed: {type: present, value: true}, recorded_result: pass}
  - {step: FAT-K-04, protocol: FAT-PW001-K, requirement: URS-PW001-029, description: "Create, change and delete a user account; check the security log.", observed: {type: present, value: true}, recorded_result: pass}
  - {step: FAT-K-05, protocol: FAT-PW001-K, requirement: URS-PW001-030, description: "Power failure simulation – safe state on restart, operator confirmation required. Switch off the main supply while the loop runs, then restore it.", observed: {type: present, value: true}, recorded_result: pass}
  # SAT (handwritten entries in Indonesian number formats).
  - {step: SAT-01, protocol: SAT-PW001, requirement: URS-PW001-001, description: "Product flow at EDI outlet with site feed water; read the product flow meter.", acceptance_text: "NLT 2 m³/h", observed: {type: number, value: 2.05, unit: m³/h}, recorded_result: pass}
  - {step: SAT-02, protocol: SAT-PW001, requirement: URS-PW001-005, description: "Distribution loop slope check.", observed: {type: number, value: 1.2, unit: "%"}, recorded_result: pass}
  - {step: SAT-03, protocol: SAT-PW001, requirement: URS-PW001-012, description: "Loop return temperature, normal operation.", acceptance_text: "Not more than 25 °C", observed: {type: number, value: 23.6, unit: °C}, recorded_result: pass}
  # S3: recorded Fail, and the SAT raises no Deviation.
  - {step: SAT-04, protocol: SAT-PW001, requirement: URS-PW001-015, description: "Softener outlet hardness.", observed: {type: number, value: 3.5, unit: mg/L}, recorded_result: fail}
  - {step: SAT-05, protocol: SAT-PW001, requirement: URS-PW001-017, description: "Run distribution pump P-301A at duty; record velocity at loop return (FIT-301).", acceptance_text: "At least 1 m/s", observed: {type: number, value: 1.4, unit: m/s}, recorded_result: pass}
  - {step: SAT-06, protocol: SAT-PW001, requirement: URS-PW001-020, description: "Hydrostatic pressure test of distribution loop.", observed: {type: present, value: true}, recorded_result: pass}
  - {step: SAT-07, protocol: SAT-PW001, requirement: URS-PW001-021, description: "Passivation of distribution loop – record solution, concentration, temperature, contact time.", observed: {type: present, value: true}, recorded_result: pass}
  - {step: SAT-08, protocol: SAT-PW001, requirement: URS-PW001-024, description: "Carbon filter outlet free chlorine.", acceptance_text: "NMT 0.05 mg/L", observed: {type: number, value: 0.03, unit: mg/L}, recorded_result: pass}
  # S4: COND-05's calibration expired 6 days before the SAT was executed.
  - {step: SAT-09, protocol: SAT-PW001, requirement: URS-PW001-026, description: "Compare CIT-302 reading with reference meter COND-05 at loop return.", instruments: [COND-05], observed: {type: number, value: 0.04, unit: µS/cm}, recorded_result: pass}
  # S5: written "1.150 L/h" (Indonesian thousands separator) on an English form.
  - {step: SAT-10, protocol: SAT-PW001, requirement: URS-PW001-032, description: "Open POU-05 fully; record flow.", observed: {type: number, value: 1150, unit: L/h}, recorded_result: pass}
  - {step: SAT-11, protocol: SAT-PW001, requirement: URS-PW001-033, description: "Turnover documentation checklist.", observed: {type: present, value: true}, recorded_result: pass}
  - {step: SAT-12, protocol: SAT-PW001, requirement: URS-PW001-034, description: "Walk-down: HX-301 installed in-line on the circulating loop return, no dead branch (against P&ID).", observed: {type: present, value: true}, recorded_result: pass}

# Calibrated instruments. Readings are judged numbers (design principle 7): drafted by an
# LLM and confirmed by the owner (check: error < U at every point, 18 Nov 2026); not
# reviewed by a practitioner. They are not Acceptance Criteria.
instruments:
  # S4: valid until T0-20d; the SAT is executed on T0-14d.
  - id: COND-05
    name: Reference conductivity meter
    serial_no: RCM-41877
    certificate:
      id: PKN-25-0388
      lab: lab-02
      calibrated_on: T0-385d
      valid_until: T0-20d
      results:
        unit: µS/cm
        points:
          - {nominal: 5.0, reading: 5.02, uncertainty: 0.05}
          - {nominal: 15.0, reading: 14.96, uncertainty: 0.15}
          - {nominal: 100.0, reading: 100.3, uncertainty: 1.0}
        drafted_by: llm
        reviewed_by: owner
  # The online TOC analyser on the loop return. Valid; used in no step (lure of probe P4).
  - id: TIT-302
    name: Online TOC analyser
    serial_no: TOC-8D-20915
    certificate:
      id: PKN-26-0105
      lab: lab-02
      calibrated_on: T0-40d
      valid_until: T0+325d
      results:
        unit: mg/L
        points:
          - {nominal: 0.25, reading: 0.248, uncertainty: 0.010}
          - {nominal: 0.50, reading: 0.505, uncertainty: 0.020}
        drafted_by: llm
        reviewed_by: owner

