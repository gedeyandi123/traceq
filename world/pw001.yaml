# Planted scenarios: four defects of existing types and one ambiguous value.
scenarios:
  - id: S1
    summary: The datasheet vent filter does not meet the URS pore size.
    targets: [DS-PW001, URS-PW001-007]
    finding:
      type: design_conflict
      severity: major
      detail: "The datasheet specifies a hydrophobic PTFE tank vent filter of 0.45 µm; the URS requires a pore size of at most 0.2 µm (bacteria-retentive)."
      at:
        - {doc: URS-PW001, field: URS-PW001-007}
        - {doc: DS-PW001, field: vent_filter_pore_size}
  - id: S2
    summary: The control-panel FAT was approved by the site after it was executed.
    reference: CPOB 12.14
    targets: [FAT-PW001-K]
    finding:
      type: vendor_protocol_not_approved
      severity: major
      detail: "FAT-PW001-K was executed before the site reviewed and released it: the customer signatures are dated after the test date. Its results cannot be used as Vendor Evidence."
      at:
        - {doc: FAT-PW001-K, text: Released for test (customer)}
        - {doc: FAT-PW001-K, text: Tested by}
  - id: S3
    summary: A SAT step is recorded Fail and no Deviation is raised.
    reference: CPOB 12.16
    targets: [SAT-04, URS-PW001-015]
    finding:
      type: failed_result_no_deviation
      severity: major
      detail: "SAT-04 records softener outlet hardness 3,5 mg/L against ≤ 1 mg/L as Fail, but the SAT records no Deviation; the failed result must be investigated and recorded."
      at:
        - {doc: SAT-PW001, field: SAT-04.observed}
        - {doc: SAT-PW001, field: SAT-04.result}
  - id: S4
    summary: The reference conductivity meter's calibration expired before the SAT.
    reference: CPOB Ch. 12
    targets: [SAT-PW001, SAT-09, COND-05]
    finding:
      type: expired_calibration
      severity: major
      detail: "Reference meter COND-05 (certificate PKN-25-0388) was used in SAT-09 six days after its calibration expired; the result lacks valid measurement Evidence."
      at:
        - {doc: SAT-PW001, field: instrument.COND-05.due}
        - {doc: SAT-PW001, field: execution.executed_by.date}
        - {doc: SAT-PW001, field: SAT-09.instruments}
        - {doc: PKN-25-0388, field: valid_until}
  - id: S5
    summary: '"1.150 L/h" in a mixed-language SAT entry is ambiguous; expected answer is "ask for confirmation".'
    targets: [SAT-10, URS-PW001-032]
    finding:
      type: ambiguous_value
      severity: minor
      detail: "SAT-10 records \"1.150 L/h\" on an English form filled in with Indonesian number formats: 1150 or 1.15 L/h. Ask the executor to confirm the value."
      at:
        - {doc: SAT-PW001, field: SAT-10.observed}

# Hallucination probes (design section 9): 5 of 46 answer-key items (36 requirements, 4
# defects, 1 ambiguous value, 5 probes would be ~11%). Four lack Evidence, one an Acceptance
# Criterion. No lure is a functional spec describing the requirement (the TP-201 pattern).
probes:
  - id: P1
    requirement: URS-PW001-006
    absent: evidence
    detail: "No FAT or SAT step measures the hot-sanitisation temperature at the loop return: FAT-S-04 checks the valve sequence only, and SAT-03 records the loop temperature in normal operation."
    lures:
      - {doc: FAT-PW001-S, text: "Hot water sanitisation – valve sequence"}
      - {doc: SAT-PW001, text: "Loop return temperature, normal operation."}
  - id: P2
    requirement: URS-PW001-016
    absent: evidence
    detail: "No FAT or SAT step tests the automatic alternation of the duty and stand-by pumps: SAT-05 runs P-301A only, and the datasheet only lists two pumps."
    lures:
      - {doc: SAT-PW001, text: "Run distribution pump P-301A at duty"}
      - {doc: DS-PW001, field: loop_return_velocity}
  - id: P3
    requirement: URS-PW001-019
    absent: acceptance
    detail: "No document gives the conductivity alarm limit; the URS and FAT-K-03 only say an alarm is raised. The EDI outlet specification limit is not an alarm limit. An OQ Acceptance Criterion beyond that is to be set by a human."
    lures:
      - {doc: URS-PW001, field: URS-PW001-002}
      - {doc: FAT-PW001-K, text: "Simulate high conductivity at the EDI outlet sensor"}
  - id: P4
    requirement: URS-PW001-027
    absent: evidence
    detail: "No FAT or SAT step checks that the online TOC analyser is installed on the loop return or that its value is shown and recorded on the HMI; the analyser's calibration certificate proves its readings on the bench only."
    lures:
      - {doc: PKN-26-0105, field: instrument}
  - id: P5
    requirement: URS-PW001-031
    absent: evidence
    detail: "No FAT or SAT step checks the bursting disc or its external rupture indicator; the material certificate lists the bursting disc holder's material only."
    lures:
      - {doc: MTC-PW001-01, text: Bursting disc holder}
