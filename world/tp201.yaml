# TP-201 world data (dataset v0): values filled; judged values await human review.
#
# Two kinds of source (design principles 5 and 7):
# - quoted: regulation or literature, copied with url + verbatim quote; the value must
#   appear in the quote (schema) and the quote on the live page (scripts/verify_quotes.py);
# - site_decision: the plant's own choice with a rationale, optionally a quote showing it
#   is realistic. These were drafted by an LLM (drafted_by: llm) and block freeze until a
#   human sets reviewed_by.
# Check: uv run python -m traceq_dataset.world world/tp201.yaml
#
# Names of the plant, vendor and people are provisional: trademark check before freeze.

tag: TP-201
name: Rotary tablet press (single-sided)
serial_no: RTP36-25-0417  # nameplate; S3 writes RTP36-25-0471 in the SAT
site: site-01

vendor:
  id: vendor-tp201
  name: Pressora Maschinenbau GmbH
  assessment:
    assessed_on: T0-200d
    scope: [mechanical, control, data_integrity, documentation]

people:
  - {id: p-qe, name: Rina Wulandari, persona: qualification_engineer, employer: site-01}
  - {id: p-qs, name: Bayu Pratama, persona: qualification_supervisor, employer: site-01}
  - {id: p-qa, name: Dewi Anggraini, persona: qa_approver, employer: site-01}
  - {id: p-wit, name: Agus Setiawan, persona: witness, employer: site-01}
  - {id: p-adm, name: Fajar Nugroho, persona: system_admin, employer: site-01}
  - {id: p-ve, name: Markus Brandt, persona: vendor_engineer, employer: vendor-tp201}

protocols:
  - {doc_id: FAT-TP201-M, stage: FAT, vendor: vendor-tp201, site_approved_on: T0-130d, executed_on: T0-120d}
  # S4: control-system FAT executed before the site approved it (CPOB 12.14).
  - {doc_id: FAT-TP201-C, stage: FAT, vendor: vendor-tp201, site_approved_on: null, executed_on: T0-118d}
  - {doc_id: SAT-TP201, stage: SAT, vendor: vendor-tp201, site_approved_on: T0-25d, executed_on: T0-14d}

requirements:
  # --- 1. Kinerja ---------------------------------------------------------------
  - id: URS-TP201-001
    section: "1. Kinerja"
    text: "Mesin memiliki {min} stasiun punch."
    param: punch_stations
    spec: {type: range, min: 36, unit: stations}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision; see Bak et al. 2025, Pharmaceutics 17(5):659, doi:10.3390/pharmaceutics17050659 §2"
      rationale: "Station count of a conventional production press, as in the cited industrial study; sets output with the turret speed."
      url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC12114868/fullTextXML
      quote: "A conventional rotary tablet press equipped with 36 punch stations was utilized."
      accessed: 2026-11-12
      drafted_by: llm
      reviewed_by: owner
    scope: mechanical
    transport_sensitive: false
    intended_coverage: covered_by_vendor
  - id: URS-TP201-002
    section: "1. Kinerja"
    text: "Kecepatan turret dapat diatur pada rentang {min}–{max} rpm."
    param: turret_speed
    spec: {type: range, min: 20, max: 70, unit: rpm}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision; see Wünsch et al. 2020, Pharmaceutics 12(4):310, doi:10.3390/pharmaceutics12040310 §2.3"
      rationale: "Speed range the plant needs for its blends; matches the range simulated in the cited scale-up study."
      url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC7238235/fullTextXML
      quote: "compaction stresses of approx. 50, 150, and 300 MPa were applied and turret speeds in the range of 20 to 70 rpm were simulated"
      accessed: 2026-11-12
      drafted_by: llm
      reviewed_by: owner
    scope: mechanical
    critical: true
    transport_sensitive: false
    intended_coverage: partial  # FAT tested a narrower range (condition 3)
  - id: URS-TP201-003
    section: "1. Kinerja"
    text: "Kapasitas produksi minimal {min} tablet/jam."
    param: output_rate
    spec: {type: range, min: 120000, unit: tablets/h}
    superseded_spec: {type: range, min: 100000, unit: tablets/h}  # S8: rev 0 value
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision; see Mohylyuk, Bandere 2023, Pharmaceutics 15(4):1236, doi:10.3390/pharmaceutics15041236 §3"
      rationale: "36 stations x 70 rpm x 60 = 151,200 tablets/h theoretical; the plant needs 120,000 (about 80% of theoretical, the same margin the cited study runs at). Rev 0 asked for 100,000 before the volume forecast was raised."
      url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC10144080/fullTextXML
      quote: "the tableting process was conducted at 80 rpm (80% of maximum speed), which is equivalent to 62,400 tab/h"
      accessed: 2026-11-12
      drafted_by: llm
      reviewed_by: owner
    scope: mechanical
    critical: true
    intended_coverage: covered_by_vendor
  - id: URS-TP201-004
    section: "1. Kinerja"
    text: "Gaya tekan utama yang dapat dicapai minimal {min} kN."
    param: main_compression_force
    spec: {type: range, min: 100, unit: kN}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision; see Wünsch et al. 2020, Pharmaceutics 12(4):310, doi:10.3390/pharmaceutics12040310 §2.3"
      rationale: "A 25 mm round tablet (URS-TP201-006) at 200 MPa needs about 98 kN, so the press must reach at least 100 kN. The cited study shows compaction stresses of 50–300 MPa are used; the plant's largest product is compressed at up to 200 MPa."
      url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC7238235/fullTextXML
      quote: "compaction stresses of approx. 50, 150, and 300 MPa were applied and turret speeds in the range of 20 to 70 rpm were simulated"
      accessed: 2026-11-12
      drafted_by: llm
      reviewed_by: owner
    scope: mechanical
    critical: true
    intended_coverage: partial  # S5: FAT value outside AC recorded "pass"
  - id: URS-TP201-005
    section: "1. Kinerja"
    text: "Gaya pra-kompresi yang dapat dicapai minimal {min} kN."
    param: precompression_force
    spec: {type: range, min: 20, unit: kN}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision"
      rationale: "Pre-compression capability of 20% of the 100 kN main compression requirement (URS-TP201-004)."
      drafted_by: llm
    scope: mechanical
    intended_coverage: covered_by_vendor
  - id: URS-TP201-006
    section: "1. Kinerja"
    text: "Diameter tablet maksimal {max} mm."
    param: tablet_diameter
    spec: {type: range, max: 25, unit: mm}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision"
      rationale: "Largest round tablet in the plant's portfolio and pipeline; EU D tooling (URS-TP201-008) is chosen for this size."
      drafted_by: llm
    scope: mechanical
    transport_sensitive: false
    intended_coverage: covered_by_vendor
  - id: URS-TP201-007
    section: "1. Kinerja"
    text: "Kedalaman pengisian maksimal {max} mm."
    param: fill_depth
    spec: {type: range, max: 18, unit: mm}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision; see Schomberg, Kwade, Finke 2020, Pharmaceutics 12(3):248, doi:10.3390/pharmaceutics12030248 §2.2"
      rationale: "Fill depth for the heaviest product with margin; the cited die-filling study used fill depths up to 16 mm."
      url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC7150958/fullTextXML
      quote: "three fill cams with fill depth of 10, 14 and 16 mm were used"
      accessed: 2026-11-12
      drafted_by: llm
      reviewed_by: owner
    scope: mechanical
    transport_sensitive: false
    intended_coverage: covered_by_vendor
  - id: URS-TP201-008
    section: "1. Kinerja"
    text: "Mesin menggunakan tooling tipe {allowed}."
    param: tooling_type
    spec: {type: one_of, allowed: [EU D]}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision; see Schomberg, Kwade, Finke 2020, Pharmaceutics 12(3):248, doi:10.3390/pharmaceutics12030248 §2.2"
      rationale: "The plant's punch inventory is EU D; the URS keeps it so tooling can be reused and 25 mm tablets fit."
      url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC7150958/fullTextXML
      quote: "The press was equipped with four flat-faced round Euro-D punches with a diameter of 9 mm."
      accessed: 2026-11-12
      drafted_by: llm
      reviewed_by: owner
    scope: mechanical
    transport_sensitive: false
    intended_coverage: conflict  # datasheet states another tooling type

  # --- 2. Material dan konstruksi ------------------------------------------------
  - id: URS-TP201-009
    section: "2. Material dan konstruksi"
    text: "Semua bagian yang kontak dengan produk terbuat dari {allowed}."
    param: product_contact_material
    spec: {type: one_of, allowed: [SS 316L]}  # decision log Q29 (S6)
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision; see PerBPOM 7/2024 Bab 4 §4.7"
      rationale: "316L is the plant standard for product contact (low carbon, better corrosion resistance under wet cleaning); CPOB 4.7 requires non-reactive contact parts."
      url: https://peraturan.go.id/files/peraturan-bpom-no-7-tahun-2024.pdf
      quote: "Bagian alat produksi yang bersentuhan dengan produk tidak boleh bersifat reaktif, aditif atau absorbtif yang dapat memengaruhi mutu dan berakibat buruk pada produk."
      accessed: 2026-11-12
      drafted_by: llm
      reviewed_by: owner
    scope: mechanical
    critical: true
    transport_sensitive: false
    intended_coverage: conflict
  - id: URS-TP201-010
    section: "2. Material dan konstruksi"
    text: "Kekasaran permukaan bagian kontak produk Ra maksimal {max} µm."
    param: contact_surface_roughness
    spec: {type: range, max: 0.8, unit: µm}
    source:
      kind: literature
      ref: "ECA Academy GMP News, 'Requirements for Plastics in Pharmaceutical Equipment Engineering'"
      url: https://www.gmp-compliance.org/gmp-news/requirements-for-plastics-in-pharmaceutical-equipment-engineering
      quote: "a surface roughness value of Ra ≤ 0.8 µm is common"
      accessed: 2026-11-12
    scope: mechanical
    transport_sensitive: false
    intended_coverage: covered_by_vendor
  - id: URS-TP201-011
    section: "2. Material dan konstruksi"
    text: "Bagian yang tidak kontak dengan produk terbuat dari {allowed}."
    param: non_contact_material
    spec: {type: one_of, allowed: [SS 304]}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision"
      rationale: "Frame and covers only need corrosion resistance for routine cleaning; 304 is the plant standard."
      drafted_by: llm
    scope: mechanical
    transport_sensitive: false
    intended_coverage: covered_by_vendor
  - id: URS-TP201-012
    section: "2. Material dan konstruksi"
    text: "Gasket dan seal yang kontak dengan produk terbuat dari {allowed}."
    param: seal_material
    spec: {type: one_of, allowed: [EPDM, silicone]}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision"
      rationale: "Plant standard elastomers for product contact, compatible with its cleaning agents; each needs a food-contact compliance statement."
      drafted_by: llm
    scope: mechanical
    transport_sensitive: false
    intended_coverage: gap
  - id: URS-TP201-013
    section: "2. Material dan konstruksi"
    text: "Pelumas yang berpotensi kontak dengan produk adalah pelumas food-grade."
    param: food_grade_lubricant
    spec: {type: present}
    source:
      kind: regulation
      ref: "PerBPOM 7/2024 Bab 4 §4.3"
      url: https://peraturan.go.id/files/peraturan-bpom-no-7-tahun-2024.pdf
      quote: "misalnya pelumas atau pendingin tidak boleh bersentuhan dengan bahan yang sedang diolah"
      accessed: 2026-11-12
    scope: mechanical
    transport_sensitive: false
    intended_coverage: gap

  # --- 3. Kontrol dan keselamatan ------------------------------------------------
  - id: URS-TP201-014
    section: "3. Kontrol dan keselamatan"
    text: "Mesin dilengkapi kontrol berat tablet otomatis berbasis gaya tekan."
    param: automatic_weight_control
    spec: {type: present}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision"
      rationale: "Weight control by compression force keeps tablet weight within limits between manual IPC checks; required on all new presses."
      drafted_by: llm
      reviewed_by: owner
    scope: control
    critical: true
    intended_coverage: partial  # tested only in the unapproved control FAT (S4)
  - id: URS-TP201-015
    section: "3. Kontrol dan keselamatan"
    text: "Tablet di luar batas berat ditolak otomatis."
    param: automatic_rejection
    spec: {type: present}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision; see PerBPOM 7/2024 Bab 5 §5.95"
      rationale: "Out-of-limit tablets must be separated automatically; CPOB 5.95 requires rejected tablets to be held in clearly marked containers."
      url: https://peraturan.go.id/files/peraturan-bpom-no-7-tahun-2024.pdf
      quote: "Tablet yang ditolak atau yang disingkirkan seharusnya ditempatkan dalam wadah yang ditandai dengan jelas"
      accessed: 2026-11-12
      drafted_by: llm
      reviewed_by: owner
    scope: control
    critical: true
    intended_coverage: partial  # S4
  - id: URS-TP201-016
    section: "3. Kontrol dan keselamatan"
    text: "Akurasi pengukuran gaya tekan maksimal ±{max}% dari skala penuh."
    param: force_measurement_accuracy
    spec: {type: range, max: 1, unit: "% FS"}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision"
      rationale: "The force signal drives weight control and rejection; ±1% of full scale keeps the 100 kN channel within ±1 kN. No brand-free source found."
      drafted_by: llm
    scope: control
    critical: true
    intended_coverage: partial  # transport-sensitive, FAT only (condition 4)
  - id: URS-TP201-017
    section: "3. Kontrol dan keselamatan"
    text: "Kecepatan paddle feeder dapat diatur pada rentang {min}–{max} rpm."
    param: feeder_paddle_speed
    spec: {type: range, min: 10, max: 60, unit: rpm}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision; see Schomberg, Kwade, Finke 2020, Pharmaceutics 12(3):248, doi:10.3390/pharmaceutics12030248 §2.2"
      rationale: "Paddle range for the plant's poorly and freely flowing blends. The cited study ran paddle speeds of 5 to 60 rpm (its Table 3), spanning that press's minimum and maximum."
      url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC7150958/fullTextXML
      quote: "three turret speeds as well as four paddle speeds were used, including the machine-specific minimum and maximum as well as intermediates"
      accessed: 2026-11-12
      drafted_by: llm
      reviewed_by: owner
    scope: control
    transport_sensitive: false
    intended_coverage: partial  # FAT range too narrow; SAT single reading is ambiguous (S7)
  - id: URS-TP201-018
    section: "3. Kontrol dan keselamatan"
    text: "Pintu pelindung dilengkapi interlock yang menghentikan mesin saat dibuka."
    param: guard_door_interlock
    spec: {type: present}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision"
      rationale: "Operator safety: opening a guard door must stop the turret (plant machinery safety standard)."
      drafted_by: llm
      reviewed_by: owner
    scope: control
    critical: true
    intended_coverage: gap
  - id: URS-TP201-019
    section: "3. Kontrol dan keselamatan"
    text: "Tombol emergency stop tersedia dan berfungsi."
    param: emergency_stop
    spec: {type: present}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision"
      rationale: "Operator safety: an emergency stop at the operator position (plant machinery safety standard)."
      drafted_by: llm
      reviewed_by: owner
    scope: control
    critical: true
    intended_coverage: covered_by_vendor
  - id: URS-TP201-020
    section: "3. Kontrol dan keselamatan"
    text: "Mesin berhenti otomatis saat terjadi overload pada punch."
    param: punch_overload_protection
    spec: {type: present}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision"
      rationale: "Protects punches and dies from damage that could release metal particles into product."
      drafted_by: llm
      reviewed_by: owner
    scope: control
    intended_coverage: covered_by_vendor

  # --- 4. Integritas data HMI (CPOB Aneks 7, decision log Q22) --------------------
  - id: URS-TP201-021
    section: "4. Integritas data HMI"
    text: "HMI memiliki level akses pengguna yang berbeda (operator, supervisor, admin)."
    param: hmi_access_levels
    spec: {type: present}
    source:
      kind: regulation
      ref: "PerBPOM 7/2024 Aneks 7 §12.1"
      url: https://peraturan.go.id/files/peraturan-bpom-no-7-tahun-2024.pdf
      quote: "Kontrol fisik dan/atau logical controls seharusnya tersedia untuk membatasi akses terhadap sistem komputerisasi kepada personel yang berwenang."
      accessed: 2026-11-12
    scope: data_integrity
    critical: true
    intended_coverage: covered_by_vendor
  - id: URS-TP201-022
    section: "4. Integritas data HMI"
    text: "HMI merekam audit trail untuk setiap perubahan parameter dan resep."
    param: hmi_audit_trail
    spec: {type: present}
    source:
      kind: regulation
      ref: "PerBPOM 7/2024 Aneks 7 §9"
      url: https://peraturan.go.id/files/peraturan-bpom-no-7-tahun-2024.pdf
      quote: "Perubahan atau penghapusan data terkait CPOB seharusnya didokumentasikan."
      accessed: 2026-11-12
    scope: data_integrity
    critical: true
    intended_coverage: partial  # S4
  - id: URS-TP201-023
    section: "4. Integritas data HMI"
    text: "HMI menyimpan log alarm beserta waktu dan pengguna."
    param: hmi_alarm_log
    spec: {type: present}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision; see PerBPOM 7/2024 Aneks 7 §12.4"
      rationale: "Alarms are GMP-relevant events; logging who acknowledged them and when follows the record-keeping rule of Aneks 7 §12.4."
      url: https://peraturan.go.id/files/peraturan-bpom-no-7-tahun-2024.pdf
      quote: "Sistem manajemen data dan dokumen seharusnya dirancang untuk mencatat identitas operator yang masuk, mengubah, mengonfirmasikan atau menghapus data termasuk tanggal dan waktu."
      accessed: 2026-11-12
      drafted_by: llm
      reviewed_by: owner
    scope: data_integrity
    intended_coverage: covered_by_vendor
  - id: URS-TP201-024
    section: "4. Integritas data HMI"
    text: "Resep produk dapat di-backup dan dipulihkan."
    param: recipe_backup
    spec: {type: present}
    source:
      kind: regulation
      ref: "PerBPOM 7/2024 Aneks 7 §7.2"
      url: https://peraturan.go.id/files/peraturan-bpom-no-7-tahun-2024.pdf
      quote: "Back-up data yang relevan seharusnya dilakukan secara teratur. Integritas dan akurasi data back-up dan kemampuan untuk mengembalikan data seharusnya diperiksa selama validasi"
      accessed: 2026-11-12
    scope: data_integrity
    intended_coverage: gap
  - id: URS-TP201-025
    section: "4. Integritas data HMI"
    text: "Jam sistem HMI disinkronkan dengan sumber waktu pabrik."
    param: time_synchronisation
    spec: {type: present}
    source:
      kind: regulation
      ref: "PIC/S PI 041-1 (2021) §9.5"
      url: https://picscheme.org/docview/4234
      quote: "The operating system clock should be synchronized with the clock of connected systems and access to all clocks restricted to authorised personnel."
      accessed: 2026-11-12
    scope: data_integrity
    intended_coverage: gap

  # --- 5. Utilitas dan lingkungan (site_only) ------------------------------------
  - id: URS-TP201-026
    section: "5. Utilitas dan lingkungan"
    text: "Mesin beroperasi dengan suplai listrik {min} V, 3 fase."
    param: power_supply_voltage
    spec: {type: range, min: 380, max: 380, unit: V}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision"
      rationale: "The plant's low-voltage supply is 220/380 V, 3 phase, 50 Hz."
      drafted_by: llm
      reviewed_by: owner
    scope: mechanical
    site_only: true
    intended_coverage: site_only
  - id: URS-TP201-027
    section: "5. Utilitas dan lingkungan"
    text: "Mesin beroperasi dengan udara tekan {min}–{max} bar."
    param: compressed_air_pressure
    spec: {type: range, min: 6, max: 7, unit: bar}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision"
      rationale: "Compressed-air header pressure at the compression-room drop point."
      drafted_by: llm
    scope: mechanical
    site_only: true
    intended_coverage: site_only
  - id: URS-TP201-028
    section: "5. Utilitas dan lingkungan"
    text: "Sambungan dust extraction kompatibel dengan sistem pabrik minimal {min} m³/jam."
    param: dust_extraction_flow
    spec: {type: range, min: 300, unit: m3/h}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision; see PerBPOM 7/2024 Bab 5 §5.91"
      rationale: "Spare capacity of the compression-room dust collector branch; CPOB 5.91 requires effective dust control on tablet presses."
      url: https://peraturan.go.id/files/peraturan-bpom-no-7-tahun-2024.pdf
      quote: "Mesin pencetak tablet seharusnya dilengkapi dengan fasilitas pengendali debu yang efektif"
      accessed: 2026-11-12
      drafted_by: llm
      reviewed_by: owner
    scope: mechanical
    site_only: true
    intended_coverage: site_only
  - id: URS-TP201-029
    section: "5. Utilitas dan lingkungan"
    text: "Tingkat kebisingan di posisi operator maksimal {max} dBA."
    param: noise_level
    spec: {type: range, max: 85, unit: dBA}
    source:
      kind: literature
      ref: "Swandito, Rusba, Antika 2025, IDENTIFIKASI 11(4), citing Permenaker 5/2018"
      url: https://jurnal.d4k3.uniba-bpn.ac.id/index.php/identifikasi/article/download/748/444/3262
      quote: "batas ambang kebisingan yang diizinkan adalah 85 dBA untuk durasi paparan selama 8 jam kerja"
      accessed: 2026-11-12
      note: "The Permenaker 5/2018 noise table is a scanned image in the official gazette, so a citing journal is quoted."
    scope: mechanical
    site_only: true
    intended_coverage: site_only
  - id: URS-TP201-030
    section: "5. Utilitas dan lingkungan"
    text: "Dimensi mesin muat di ruang cetak dengan tinggi plafon {max} mm."
    param: room_height_fit
    spec: {type: range, max: 3000, unit: mm}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision"
      rationale: "Clear ceiling height of the compression room."
      drafted_by: llm
    scope: mechanical
    site_only: true
    intended_coverage: site_only
  - id: URS-TP201-031
    section: "5. Utilitas dan lingkungan"
    text: "Mesin beroperasi normal pada suhu ruang {min}–{max} °C."
    param: room_temperature
    spec: {type: range, min: 18, max: 25, unit: °C}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision"
      rationale: "Compression-room HVAC design range."
      drafted_by: llm
    scope: mechanical
    site_only: true
    intended_coverage: site_only

  # --- 6. Pembersihan -------------------------------------------------------------
  - id: URS-TP201-032
    section: "6. Pembersihan"
    text: "Waktu changeover dan pembersihan antar produk maksimal {max} menit."
    param: changeover_time
    spec: {type: range, max: 120, unit: min}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision"
      rationale: "Production planning allows a two-hour block per product changeover."
      drafted_by: llm
    scope: mechanical
    transport_sensitive: false
    intended_coverage: gap
  - id: URS-TP201-033
    section: "6. Pembersihan"
    text: "Bagian kontak produk dapat dilepas untuk dibersihkan tanpa alat khusus."
    param: toolless_disassembly
    spec: {type: present}
    source:
      kind: regulation
      ref: "PerBPOM 7/2024 Bab 4 §4.5"
      url: https://peraturan.go.id/files/peraturan-bpom-no-7-tahun-2024.pdf
      quote: "Peralatan manufaktur seharusnya didesain sedemikian rupa agar mudah dibersihkan."
      accessed: 2026-11-12
    scope: mechanical
    transport_sensitive: false
    intended_coverage: covered_by_vendor

  # --- 7. Dokumentasi -------------------------------------------------------------
  - id: URS-TP201-034
    section: "7. Dokumentasi"
    text: "Manual operasi dan perawatan tersedia dalam bahasa Indonesia atau Inggris."
    param: manuals
    spec: {type: present}
    source:
      kind: regulation
      ref: "PerBPOM 7/2024 Bab 12 §12.27c"
      url: https://peraturan.go.id/files/peraturan-bpom-no-7-tahun-2024.pdf
      quote: "pengumpulan dan pemeriksaan dokumen instruksi kerja dan instruksi pengoperasian serta instruksi perawatan peralatan"
      accessed: 2026-11-12
    scope: documentation
    transport_sensitive: false
    intended_coverage: covered_by_vendor
  - id: URS-TP201-035
    section: "7. Dokumentasi"
    text: "Sertifikat material 3.1 tersedia untuk semua bagian kontak produk."
    param: material_certificates
    spec: {type: present}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision; see PerBPOM 7/2024 Bab 4 §4.7"
      rationale: "Type 3.1 material certificates are the plant's accepted Evidence that contact parts meet CPOB 4.7."
      url: https://peraturan.go.id/files/peraturan-bpom-no-7-tahun-2024.pdf
      quote: "Bagian alat produksi yang bersentuhan dengan produk tidak boleh bersifat reaktif, aditif atau absorbtif yang dapat memengaruhi mutu dan berakibat buruk pada produk."
      accessed: 2026-11-12
      drafted_by: llm
      reviewed_by: owner
    scope: documentation
    transport_sensitive: false
    intended_coverage: covered_by_vendor
  - id: URS-TP201-036
    section: "7. Dokumentasi"
    text: "Sertifikat kalibrasi sensor gaya tekan tersedia dan masih berlaku."
    param: force_sensor_calibration
    spec: {type: present}
    source:
      kind: regulation
      ref: "PerBPOM 7/2024 Bab 4 §4.10"
      url: https://peraturan.go.id/files/peraturan-bpom-no-7-tahun-2024.pdf
      quote: "Peralatan untuk mengukur, menimbang, mencatat dan mengendalikan seharusnya dikalibrasi dan diperiksa pada interval waktu tertentu"
      accessed: 2026-11-12
    scope: documentation
    intended_coverage: partial  # transport-sensitive, FAT only (condition 4)
  - id: URS-TP201-037
    section: "7. Dokumentasi"
    text: "Deklarasi kesesuaian keselamatan mesin tersedia."
    param: machinery_safety_declaration
    spec: {type: present}
    source:
      kind: site_decision
      ref: "VMP TP-201, site decision"
      rationale: "Corporate purchasing standard: imported machines come with a machinery safety declaration of conformity."
      drafted_by: llm
    scope: documentation
    transport_sensitive: false
    intended_coverage: gap
  - id: URS-TP201-038
    section: "7. Dokumentasi"
    text: "Daftar suku cadang dan gambar teknis as-built tersedia."
    param: spare_parts_and_drawings
    spec: {type: present}
    source:
      kind: regulation
      ref: "PerBPOM 7/2024 Bab 12 §12.27a"
      url: https://peraturan.go.id/files/peraturan-bpom-no-7-tahun-2024.pdf
      quote: "verifikasi kebenaran instalasi komponen, instrumentasi, peralatan, pemipaan, dan peralatan penunjang sesuai dengan gambar teknis dan spesifikasi"
      accessed: 2026-11-12
    scope: documentation
    transport_sensitive: false
    intended_coverage: covered_by_vendor

# Executed FAT/SAT steps. Observed values follow the URS values once filled;
# recorded_result is the design intent (S5 records "pass" on an out-of-limit value).
tests:
  - {step: FAT-M-01, protocol: FAT-TP201-M, requirement: URS-TP201-001, observed: {type: number, value: 36, unit: stations}, recorded_result: pass, description: "Count the punch stations on the turret."}
  - {step: FAT-M-02, protocol: FAT-TP201-M, requirement: URS-TP201-002, observed: {type: range, min: 20, max: 60, unit: rpm}, recorded_result: pass, description: "Run the empty turret across its speed range; record the lowest and highest stable speed.", acceptance: {type: range, min: 20, max: 60, unit: rpm}}
  - {step: FAT-M-03, protocol: FAT-TP201-M, requirement: URS-TP201-004, observed: {type: number, value: 96, unit: kN}, recorded_result: pass, description: "Apply main compression with the test tooling; record the highest force reached."}  # S5: below the 100 kN AC, recorded pass
  - {step: FAT-M-04, protocol: FAT-TP201-M, requirement: URS-TP201-006, observed: {type: number, value: 25, unit: mm}, recorded_result: pass, description: "Fit tooling for the largest tablet diameter and run 5 minutes."}
  - {step: FAT-M-05, protocol: FAT-TP201-M, requirement: URS-TP201-007, observed: {type: number, value: 18, unit: mm}, recorded_result: pass, description: "Set the maximum fill cam; measure the fill depth."}
  - {step: FAT-M-06, protocol: FAT-TP201-M, requirement: URS-TP201-010, observed: {type: number, value: 0.6, unit: µm}, recorded_result: pass, description: "Measure surface roughness Ra on product-contact parts."}
  - {step: FAT-M-07, protocol: FAT-TP201-M, requirement: URS-TP201-011, observed: {type: text, value: SS 304}, recorded_result: pass, description: "Check frame and cover material against the bill of materials."}
  - {step: FAT-M-08, protocol: FAT-TP201-M, requirement: URS-TP201-016, observed: {type: number, value: 0.5, unit: "% FS"}, recorded_result: pass, description: "Check the main compression force channel against a reference load cell."}
  - {step: FAT-M-09, protocol: FAT-TP201-M, requirement: URS-TP201-017, observed: {type: range, min: 20, max: 60, unit: rpm}, recorded_result: pass, description: "Run the paddle feeder across its speed range; record the lowest and highest speed.", acceptance: {type: range, min: 20, max: 60, unit: rpm}}
  - {step: FAT-M-10, protocol: FAT-TP201-M, requirement: URS-TP201-033, observed: {type: present, value: true}, recorded_result: pass, description: "Remove and refit product-contact parts without tools."}
  - {step: FAT-M-11, protocol: FAT-TP201-M, requirement: URS-TP201-034, observed: {type: present, value: true}, recorded_result: pass, description: "Check that operating and maintenance manuals are supplied."}
  - {step: FAT-M-12, protocol: FAT-TP201-M, requirement: URS-TP201-035, observed: {type: present, value: true}, recorded_result: pass, description: "Check 3.1 material certificates for all product-contact parts."}
  - {step: FAT-M-13, protocol: FAT-TP201-M, requirement: URS-TP201-036, observed: {type: present, value: true}, recorded_result: pass, description: "Check calibration certificates of the compression force sensors."}
  - {step: FAT-M-14, protocol: FAT-TP201-M, requirement: URS-TP201-038, observed: {type: present, value: true}, recorded_result: pass, description: "Check the spare parts list and as-built drawings."}
  - {step: FAT-C-01, protocol: FAT-TP201-C, requirement: URS-TP201-014, observed: {type: present, value: true}, recorded_result: pass, description: "Simulate a tablet weight drift; confirm the force-based weight control corrects it."}
  - {step: FAT-C-02, protocol: FAT-TP201-C, requirement: URS-TP201-015, observed: {type: present, value: true}, recorded_result: pass, description: "Feed out-of-limit tablets; confirm they are rejected automatically."}
  - {step: FAT-C-03, protocol: FAT-TP201-C, requirement: URS-TP201-022, observed: {type: present, value: true}, recorded_result: pass, description: "Change a parameter and a recipe on the HMI; confirm both appear in the audit trail."}
  # SAT steps are printed on the vendor form; results are handwritten by site staff.
  - step: SAT-01
    protocol: SAT-TP201
    requirement: URS-TP201-003
    description: "Run placebo blend at production speed for 10 min; count the tablets and convert to tablets per hour. Check turret speed with the tachometer."
    instruments: [TACH-07, SW-03]
    observed: {type: number, value: 122400, unit: tablets/h}
    correction: {original: {type: number, value: 121400, unit: tablets/h}}  # S1: one digit overwritten, no initials/date
    recorded_result: pass
  - {step: SAT-02, protocol: SAT-TP201, requirement: URS-TP201-005, observed: {type: number, value: 20.4, unit: kN}, recorded_result: pass, description: "Set pre-compression to maximum; read the force on the HMI."}
  - {step: SAT-03, protocol: SAT-TP201, requirement: URS-TP201-017, observed: {type: number, value: 1500, unit: rpm}, recorded_result: pass, description: "Run the paddle feeder at its maximum setting; measure the speed with the tachometer.", instruments: [TACH-07]}  # S7: drive-motor speed, written "1.500 rpm"
  - {step: SAT-04, protocol: SAT-TP201, requirement: URS-TP201-019, observed: {type: present, value: true}, recorded_result: pass, description: "Press each emergency stop while running; the press must stop."}
  - {step: SAT-05, protocol: SAT-TP201, requirement: URS-TP201-020, observed: {type: present, value: true}, recorded_result: pass, description: "Simulate a punch overload; the press must stop."}
  - {step: SAT-06, protocol: SAT-TP201, requirement: URS-TP201-021, observed: {type: present, value: true}, recorded_result: pass, description: "Log in as operator, supervisor and admin; confirm each sees only its own functions."}
  - {step: SAT-07, protocol: SAT-TP201, requirement: URS-TP201-023, observed: {type: present, value: true}, recorded_result: pass, description: "Trigger an alarm and acknowledge it; confirm the alarm log shows time and user."}

# Site test instruments. S2: TACH-07's calibration lapsed the day before the SAT (T0-14d).
instruments:
  - {id: TACH-07, name: Digital tachometer, serial_no: DT2236-58812, certificate: {id: KAL-2025-0412, calibrated_on: T0-380d, valid_until: T0-15d}}
  - {id: SW-03, name: Stopwatch, serial_no: SW-11907, certificate: {id: KAL-2026-0057, calibrated_on: T0-120d, valid_until: T0+245d}}

# Design and delivered-item facts.
designs:
  - {doc_id: DS-TP201, requirement: URS-TP201-008, observed: {type: text, value: EU B}}
  - {doc_id: MTC-TP201-01, requirement: URS-TP201-009, observed: {type: text, value: SS 304}}  # S6, decision log Q29

# Rendered documents. Rev 1 is issued before the vendor assessment (T0-200d).
documents:
  - {id: URS-TP201, rev: 0, type: urs, language: id, issued_on: T0-260d, prepared_by: p-qe, checked_by: p-qs, approved_by: p-qa}
  - id: URS-TP201
    rev: 1
    type: urs
    language: id
    issued_on: T0-215d
    prepared_by: p-qe
    checked_by: p-qs
    approved_by: p-qa
    change_note: "URS-TP201-003: kapasitas produksi minimal dinaikkan sesuai revisi proyeksi volume."  # S8
  # FAT: combined protocol and report. Site approval date comes from the protocol.
  - {id: FAT-TP201-M, rev: 0, type: fat, title: Mechanical, language: en, issued_on: T0-140d, prepared_by: p-ve, checked_by: p-qs, approved_by: p-qa, executed_by: p-ve, witnessed_by: p-wit}
  # S4: no site check or approval before execution.
  - {id: FAT-TP201-C, rev: 0, type: fat, title: Control system, language: en, issued_on: T0-138d, prepared_by: p-ve, executed_by: p-ve, witnessed_by: p-wit}
  # SAT: vendor form in English, filled in by hand at site (Indonesian number/date formats),
  # published as a medium-quality scan.
  # S3: the serial number is written with two digits transposed.
  - {id: SAT-TP201, rev: 0, type: sat, language: en, entry_language: id, serial_no: RTP36-25-0471, scan: medium, issued_on: T0-30d, prepared_by: p-ve, checked_by: p-qs, approved_by: p-qa, executed_by: p-ve, witnessed_by: p-wit}

scenarios:
  - id: S1
    summary: A SAT entry is overwritten without initials or date.
    reference: CPOB 10.8; PIC/S PI 041-1 §8.7
    targets: [SAT-01]
  - id: S2
    summary: The tachometer calibration certificate expired on the SAT date.
    reference: CPOB Ch. 12
    targets: [SAT-TP201, SAT-01, SAT-03, TACH-07]
  - id: S3
    summary: The SAT serial number differs from the nameplate and datasheet.
    targets: [SAT-TP201, DS-TP201]
    note: SAT-TP201 has RTP36-25-0471; the nameplate (Equipment.serial_no) has RTP36-25-0417.
  - id: S4
    summary: The control-system FAT protocol was executed without site approval.
    reference: CPOB 12.14
    targets: [FAT-TP201-C]
  - id: S5
    summary: A FAT result outside the Acceptance Criterion is marked "Pass".
    reference: CPOB 12.16
    targets: [FAT-M-03, URS-TP201-004]
  - id: S6
    summary: The material certificate says SS 304; the URS requires SS 316L.
    targets: [MTC-TP201-01, URS-TP201-009]
  - id: S7
    summary: '"1.500 rpm" in a mixed-language SAT entry is ambiguous; expected answer is "ask for confirmation".'
    targets: [SAT-03, URS-TP201-017]
  - id: S8
    summary: URS rev 0 -> rev 1 changes one value.
    targets: [URS-TP201-003]
