[project]
name = "traceq-dataset"
version = "0.0.0"
description = "Synthetic qualification dataset for TraceQ: world data schema, answer key, renderer."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11",
    "pypdf>=6",
    "pyyaml>=6.0.2",
    "typst==0.15.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traceq_dataset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
