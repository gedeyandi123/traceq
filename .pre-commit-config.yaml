repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: denylist
        name: denylist (vendor and private names)
        entry: python scripts/check_denylist.py
        language: python
        types: [text]
      - id: hook-tests
        name: Claude Code hook tests (node)
        entry: node -e "const {execFileSync}=require('node:child_process'); for (const f of ['.claude/hooks/readonly-bash.test.mjs','.claude/hooks/heldout-bash.test.mjs']) execFileSync(process.execPath,[f],{stdio:'inherit'})"
        language: system
        files: ^\.claude/hooks/
        pass_filenames: false
