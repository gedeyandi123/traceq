# Postgres for TraceQ (spec #105): `docker compose up -d postgres`. Local machine only.
# The superuser password is for this local demo server; the roles TraceQ connects as are
# created by src/traceq/db/roles.sql when the data volume is first initialised (and again,
# idempotently, by the test fixture).
name: traceq

services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/traceq/db/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: ["keycloak"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./compose/keycloak/traceq-realm.json:/opt/keycloak/data/import/traceq-realm.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3",
        ]
      interval: 2s
      timeout: 5s
      start_period: 30s
      retries: 60

volumes:
  pgdata:
